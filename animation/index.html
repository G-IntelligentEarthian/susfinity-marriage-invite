<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R&A Wedding | Earth Conscious</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --sage: #A8C3A6;
            --eucalyptus: #6F9F8F;
            --cream: #F3F1EB;
            --stone: #6E6E6E;
            --terracotta: #C07A5A;
            --white: #FFFFFF;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--cream);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO OVERLAY --- */
        #intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background-color: var(--cream);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out;
        }

        /* --- ENVELOPE --- */
        .envelope-wrapper {
            position: relative;
            width: 320px;
            height: 220px;
            perspective: 1000px;
        }

        .envelope-base {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background-color: #e9e5db;
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 1;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--sage);
            clip-path: polygon(0 0, 50% 50%, 100% 0);
            z-index: 4;
            transform-origin: top;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- WAX SEAL (SPLIT ANIMATION) --- */
        .wax-seal-container {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            z-index: 5;
            transition: opacity 0.3s ease;
        }

        .seal-half {
            position: absolute;
            width: 30px;
            height: 60px;
            background: var(--terracotta);
            transition: all 0.6s ease-in;
        }

        .seal-left {
            left: 0;
            border-radius: 60px 0 0 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            overflow: hidden;
        }

        .seal-right {
            right: 0;
            border-radius: 0 60px 60px 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
        }

        .seal-half span {
            color: white;
            font-weight: bold;
            font-size: 10px;
            width: 60px;
            text-align: center;
            position: absolute;
        }

        /* --- THE CARD --- */
        .invitation-card {
            position: absolute;
            top: 5px;
            left: 5%;
            width: 90%;
            height: 90%;
            background: var(--white);
            z-index: 2;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                        width 0.8s ease, height 0.8s ease, left 0.8s ease, top 0.8s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid #eee;
        }

        /* --- ANIMATION STATES --- */
        .is-open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 0;
        }

        .is-open .seal-left { transform: translateX(-20px) rotate(-20deg); opacity: 0; }
        .is-open .seal-right { transform: translateX(20px) rotate(20deg); opacity: 0; }

        .card-extracted .invitation-card {
            transform: translateY(-110%);
        }

        .card-expanded .invitation-card {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform: translateY(0);
            z-index: 10000;
        }

        /* --- HERO SECTION --- */
        #main-content {
            opacity: 0;
            transition: opacity 1.5s ease;
            padding: 100px 20px;
            text-align: center;
        }

        .hero-box {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid var(--sage);
            padding: 80px 40px;
        }

        .btn-secondary {
            margin-top: 30px;
            background: transparent;
            border: 1px solid var(--stone);
            color: var(--stone);
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--stone);
            color: white;
        }

        #skip-intro {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--stone);
            text-decoration: underline;
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 10001;
        }
    </style>
</head>
<body>

    <button id="skip-intro">Skip Intro</button>

    <div id="intro-overlay">
        <div class="envelope-wrapper" id="envelope">
            <div class="envelope-flap"></div>

            <div class="wax-seal-container">
                <div class="seal-half seal-left"><span>R & A</span></div>
                <div class="seal-half seal-right"><span>R & A</span></div>
            </div>

            <div class="envelope-base"></div>

            <div class="invitation-card" id="main-card">
                <p style="font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase;">A Sustainable Celebration</p>
                <h2 style="font-family: 'Playfair Display', serif; color: var(--eucalyptus); font-size: 1.4rem;">Rupadharshnee & Aravind</h2>
                <div style="width: 30px; height: 1px; background: var(--sage); margin: 15px 0;"></div>
                <p style="font-size: 0.7rem; font-style: italic;">Loading Experience...</p>
            </div>
        </div>
    </div>

    <main id="main-content">
        <section class="hero-box">
            <p style="letter-spacing: 4px; color: var(--stone); font-size: 0.8rem;">04 . 04 . 2026</p>
            <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--eucalyptus); margin: 15px 0;">Earth & Infinity</h1>
            <p style="max-width: 450px; margin: 0 auto; line-height: 1.8; color: var(--stone);">
                Welcome to our wedding portal. We have designed this day to be as kind to the planet as it is joyful for our guests.
            </p>

            <button class="btn-secondary" onclick="replayAnimation()">Replay Animation</button>
        </section>
    </main>

    <script>
        const overlay = document.getElementById('intro-overlay');
        const envelope = document.getElementById('envelope');
        const main = document.getElementById('main-content');
        const skip = document.getElementById('skip-intro');

        // Check Local Storage
        window.onload = () => {
            if (localStorage.getItem('weddingIntroPlayed')) {
                showHeroDirectly();
            } else {
                startSequence();
            }
        };

        function startSequence() {
            // Wait 1s for initial load
            setTimeout(() => {
                // 1. Break Seal & Open Flap
                envelope.classList.add('is-open');

                // 2. Extract Card
                setTimeout(() => {
                    envelope.classList.add('card-extracted');
                }, 1200);

                // 3. Expand Card
                setTimeout(() => {
                    envelope.classList.add('card-expanded');
                }, 2500);

                // 4. Fade to Hero
                setTimeout(() => {
                    showHeroDirectly();
                }, 4000);
            }, 1000);
        }

        function showHeroDirectly() {
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                skip.style.display = 'none';
                main.style.opacity = '1';
                localStorage.setItem('weddingIntroPlayed', 'true');
            }, 1000);
        }

        function replayAnimation() {
            // Reset storage
            localStorage.removeItem('weddingIntroPlayed');

            // Reset CSS classes
            envelope.classList.remove('is-open', 'card-extracted', 'card-expanded');

            // Show Overlay
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            main.style.opacity = '0';
            skip.style.display = 'block';

            // Restart
            startSequence();
        }

        skip.addEventListener('click', showHeroDirectly);
    </script>
</body>
</html>
