<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thank You — Rupadharshnee & Aravind</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --eucalyptus: #6F9F8F;
    --sage: #A8C3A6;
    --clay: #C07A5A;
    --stone: #6E6E6E;
    --deep-green: #3d6b5e;
    --petal: #f9f7f2;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--petal);
    font-family: 'Jost', sans-serif;
    color: var(--stone);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(168,195,166,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(111,159,143,0.12) 0%, transparent 55%);
    pointer-events: none;
  }
  .card {
    position: relative;
    background: rgba(255,255,255,0.78);
    border: 1px solid rgba(168,195,166,0.4);
    border-radius: 28px;
    padding: 64px 48px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(8px);
    box-shadow: 0 12px 48px rgba(111,159,143,0.12);
    animation: fadeUp 0.8s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .wreath {
    position: absolute;
    top: -36px; left: 50%;
    transform: translateX(-50%);
    font-size: 64px;
    line-height: 1;
    animation: fadeUp 0.8s ease 0.1s both;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    color: var(--clay);
    margin-top: 24px;
    margin-bottom: 16px;
    line-height: 1.2;
    animation: fadeUp 0.8s ease 0.2s both;
  }
  p {
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--stone);
    margin-bottom: 12px;
    animation: fadeUp 0.8s ease 0.3s both;
  }
  .divider {
    display: flex; align-items: center; gap: 14px;
    margin: 28px auto;
    width: 220px;
    animation: fadeUp 0.8s ease 0.35s both;
  }
  .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--sage), transparent); }
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--eucalyptus);
    animation: fadeUp 0.8s ease 0.4s both;
  }
  .back-btn {
    display: inline-block;
    margin-top: 32px;
    background: linear-gradient(135deg, var(--eucalyptus), var(--deep-green));
    color: white;
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 13px 32px;
    border-radius: 40px;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.2s;
    animation: fadeUp 0.8s ease 0.5s both;
  }
  .back-btn:hover { opacity: 0.88; transform: translateY(-2px); }
  @media (max-width: 480px) { .card { padding: 56px 24px 40px; } }
</style>
</head>
<body>
  <div class="card">
    <div class="wreath">🌿</div>
    <h1>Thank you,<br>dear one.</h1>
    <p>Your RSVP has been received with gratitude and warmth.</p>
    <p>We look forward to celebrating with you — mindfully, joyfully, and with deep love for the Earth.</p>
    <div class="divider">
      <div class="divider-line"></div>
      <span style="color:var(--sage);font-size:13px;">✦</span>
      <div class="divider-line"></div>
    </div>
    <p class="tagline">With love, gratitude, and respect for the Earth 🌍</p>
    <p style="font-size:12px;opacity:0.65;margin-top:8px;">Rupadharshnee & Aravind · June 2026</p>
    <a href="/" class="back-btn">← Back to Invitation</a>
  </div>
</body>
</html>
